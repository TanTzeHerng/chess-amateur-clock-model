name: Build patched IBM701 SIMH

on:
  push:
    branches: [ibm701-ci-debug]
  workflow_dispatch:

concurrency:
  group: ibm701-build-debug
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout SIMH
        uses: actions/checkout@v4
        with:
          repository: simh/simh
          path: simh

      - name: Patch IBM 701 memory model
        shell: powershell
        run: |
          $defs = 'simh/I7000/i7000_defs.h'
          $cpu = 'simh/I7000/i701_cpu.c'

          $d = Get-Content $defs -Raw
          $old = '#define MEMSIZE         (cpu_unit.capac)                /* actual memory size */'
          $new = @(
            '#ifdef I701',
            '#define MEMSIZE         (MAXMEMSIZE)                     /* physical 36-bit words */',
            '#else',
            '#define MEMSIZE         (cpu_unit.capac)                 /* actual memory size */',
            '#endif'
          ) -join [Environment]::NewLine
          if (-not $d.Contains($old)) { throw 'MEMSIZE patch anchor not found' }
          $d = $d.Replace($old, $new)
          Set-Content $defs -Value $d -Encoding ascii

          $c = Get-Content $cpu -Raw
          $old2 = '{ UDATA(NULL, UNIT_BINK, MAXMEMSIZE / 2) };'
          $new2 = '{ UDATA(NULL, UNIT_BINK, MAXMEMSIZE * 2) };'
          if (-not $c.Contains($old2)) { throw 'cpu_unit patch anchor not found' }
          $c = $c.Replace($old2, $new2)
          Set-Content $cpu -Value $c -Encoding ascii

          Select-String -Path $defs -Pattern 'MEMSIZE'
          Select-String -Path $cpu -Pattern 'UDATA\(NULL, UNIT_BINK'

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            git

      - name: Build i701.exe
        shell: cmd
        run: |
          set "PATH=C:\msys64\mingw64\bin;%PATH%"
          cd simh
          mingw32-make.exe -f makefile SHELL=C:/Windows/System32/cmd.exe i701
          if errorlevel 1 exit /b 10
          if not exist BIN\i701.exe exit /b 11
          dir BIN\i701.exe
          certutil -hashfile BIN\i701.exe SHA256

      - name: Self-test memory access
        shell: powershell
        run: |
          Copy-Item simh\BIN\i701.exe .\i701-patched.exe
          Set-Content stop.oct -Encoding ascii -Value '0000 000000000000'
          $lines = @(
            'set nothrottle',
            'load stop.oct',
            'deposit IC 0',
            'go',
            'echo PATCHED_GO_OK',
            'echo PATCHED_UPPER_MEMORY',
            'examine 7776-7777',
            'quit'
          )
          Set-Content test.ini -Encoding ascii -Value ($lines -join [Environment]::NewLine)
          $p = Start-Process -FilePath .\i701-patched.exe -ArgumentList 'test.ini' -RedirectStandardOutput patched-out.log -RedirectStandardError patched-err.log -PassThru -NoNewWindow
          if (-not $p.WaitForExit(15000)) {
            $p.Kill()
            throw 'patched i701 self-test timed out'
          }
          Get-Content patched-out.log
          if (Test-Path patched-err.log) { Get-Content patched-err.log }
          if (-not (Select-String patched-out.log -SimpleMatch 'PATCHED_GO_OK' -Quiet)) { throw "GO failed rc=$($p.ExitCode)" }
          if (-not (Select-String patched-out.log -SimpleMatch 'PATCHED_UPPER_MEMORY' -Quiet)) { throw 'upper-memory examine failed' }

      - name: Upload patched i701
        uses: actions/upload-artifact@v4
        with:
          name: i701-patched-windows
          path: |
            i701-patched.exe
            patched-out.log
            patched-err.log
